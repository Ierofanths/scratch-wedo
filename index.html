<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeDo 2.0 για Scratch – STEM Education</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --block: #0FBD8C;
    --block-dark: #0B8E69;
    --blue: #4C97FF;
    --blue-dark: #3373CC;
    --bg: #F4F8FB;
    --surface: #FFFFFF;
    --ink: #1D2B3A;
    --muted: #586A7D;
    --line: #D6E0E9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181F;
      --surface: #1B232D;
      --ink: #E8EEF4;
      --muted: #9AABBD;
      --line: #2E3A47;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Commissioner", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }

  .lang-switch { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 32px; }
  .lang-switch button {
    font: inherit; font-size: .9rem; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  h1 { font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.1; margin: 0 0 12px; font-weight: 800; letter-spacing: -.02em; }
  .lead { font-size: 1.15rem; color: var(--muted); margin: 0 0 40px; max-width: 60ch; }

  /* Τα κουμπιά έχουν σχήμα block του Scratch */
  .blocks { display: grid; gap: 28px; margin-bottom: 56px; }
  .block-btn {
    --c: var(--block); --d: var(--block-dark);
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    text-decoration: none; color: #fff; background: var(--c);
    border: 2px solid var(--d); border-radius: 8px;
    padding: 22px 26px 22px 30px; font-size: 1.35rem; font-weight: 800;
    box-shadow: 0 4px 0 var(--d);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .block-btn::before, .block-btn::after {
    content: ""; position: absolute; left: 28px; width: 34px; height: 9px; background: var(--c);
  }
  .block-btn::before { top: -2px; background: var(--bg); border: 2px solid var(--d); border-top: 0; border-radius: 0 0 8px 8px; }
  .block-btn::after { bottom: -11px; border: 2px solid var(--d); border-top: 0; border-radius: 0 0 8px 8px; }
  .block-btn small { display: block; font-weight: 400; font-size: .95rem; opacity: .92; }
  .block-btn .go { font-size: 1rem; background: rgba(255,255,255,.22); padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
  .block-btn:hover { transform: translateY(-1px); }
  .block-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--d); }
  .block-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }

  section { margin-bottom: 44px; }
  h2 { font-size: 1.35rem; margin: 0 0 14px; }
  ol { padding-left: 1.3em; margin: 0; }
  ol li { margin-bottom: 10px; padding-left: 4px; }
  .note { color: var(--muted); font-size: .97rem; }

  .share { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
  .share-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .share-item h3 { margin: 0 0 12px; font-size: 1rem; }
  .qr { background: #fff; padding: 10px; border-radius: 8px; width: fit-content; margin-bottom: 12px; }
  .qr img, .qr canvas { display: block; }
  .copy-row { display: flex; gap: 8px; }
  .copy-row input {
    flex: 1; min-width: 0; font: inherit; font-size: .8rem; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
  }
  .copy-row button {
    font: inherit; font-size: .85rem; font-weight: 600; padding: 8px 12px; cursor: pointer;
    border: 0; border-radius: 6px; background: var(--blue); color: #fff;
  }
  .copy-row button:focus-visible, .copy-row input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  footer { border-top: 1px solid var(--line); padding-top: 20px; color: var(--muted); font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { .block-btn { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="lang-switch" role="group" aria-label="Γλώσσα / Language">
    <button type="button" data-set-lang="el" aria-pressed="true">Ελληνικά</button>
    <button type="button" data-set-lang="en" aria-pressed="false">English</button>
  </div>

  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>

  <div class="blocks">
    <a class="block-btn" id="open-el" target="_blank" rel="noopener">
      <span><span data-t="btnEl"></span><small data-t="btnElSub"></small></span>
      <span class="go" data-t="open"></span>
    </a>
    <a class="block-btn" id="open-en" target="_blank" rel="noopener" style="--c: var(--blue); --d: var(--blue-dark);">
      <span><span data-t="btnEn"></span><small data-t="btnEnSub"></small></span>
      <span class="go" data-t="open"></span>
    </a>
  </div>

  <section>
    <h2 data-t="stepsTitle"></h2>
    <ol>
      <li data-t="s1"></li>
      <li data-t="s2"></li>
      <li data-t="s3"></li>
      <li data-t="s4"></li>
    </ol>
  </section>

  <section>
    <h2 data-t="reqTitle"></h2>
    <p class="note" data-t="req"></p>
  </section>

  <section>
    <h2 data-t="shareTitle"></h2>
    <p class="note" data-t="shareText"></p>
    <div class="share">
      <div class="share-item">
        <h3 data-t="btnEl"></h3>
        <div class="qr" id="qr-el"></div>
        <div class="copy-row"><input id="url-el" readonly aria-label="Link"><button type="button" data-copy="url-el" data-t="copy"></button></div>
      </div>
      <div class="share-item">
        <h3 data-t="btnEn"></h3>
        <div class="qr" id="qr-en"></div>
        <div class="copy-row"><input id="url-en" readonly aria-label="Link"><button type="button" data-copy="url-en" data-t="copy"></button></div>
      </div>
    </div>
  </section>

  <footer data-t="footer"></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const TEXT = {
    el: {
      title: 'WeDo 2.0 για Scratch',
      lead: 'Τα blocks του WeDo 2.0 μέσα στον editor του Scratch, με σύνδεση απευθείας από τον browser. Χωρίς εγκατάσταση και χωρίς Scratch Link.',
      btnEl: 'Ελληνικά blocks', btnElSub: 'Για ελληνόφωνες τάξεις',
      btnEn: 'English blocks', btnEnSub: 'For English-speaking classes',
      open: 'Άνοιγμα editor',
      stepsTitle: 'Πώς ξεκινάμε',
      s1: 'Πατήστε ένα από τα δύο κουμπιά. Ο editor ανοίγει με τα blocks του WeDo 2.0 ήδη στην παλέτα.',
      s2: 'Αν ο editor ρωτήσει αν θα επιτρέψει την επέκταση χωρίς sandbox, επιλέξτε να την επιτρέψετε. Χωρίς αυτό δεν έχει πρόσβαση στο Bluetooth.',
      s3: 'Πατήστε το πράσινο κουμπί «Σύνδεση με WeDo 2.0» στην παλέτα και μετά το κουμπί του hub, ώστε να αναβοσβήνει.',
      s4: 'Επιλέξτε το hub από τη λίστα. Όταν συνδεθεί, το φως του γίνεται μπλε.',
      reqTitle: 'Τι χρειάζεται',
      req: 'Chrome ή Edge σε Windows, macOS, ChromeOS ή Android tablet. Δεν λειτουργεί σε iPad ή σε Firefox. Το internet χρειάζεται μόνο για να ανοίξει η σελίδα· η επικοινωνία με το hub γίνεται τοπικά μέσω Bluetooth.',
      shareTitle: 'Για τον εκπαιδευτικό',
      shareText: 'Προβάλετε τον κωδικό QR στην τάξη ή μοιραστείτε το link. Ένα project φτιαγμένο με τα ελληνικά blocks ανοίγει κανονικά και με τα αγγλικά.',
      copy: 'Αντιγραφή', copied: 'Αντιγράφηκε',
      footer: 'STEM Education · Επέκταση για τον editor TurboWarp (συμβατό με Scratch 3).'
    },
    en: {
      title: 'WeDo 2.0 for Scratch',
      lead: 'WeDo 2.0 blocks inside the Scratch editor, connecting straight from the browser. Nothing to install and no Scratch Link.',
      btnEl: 'Greek blocks', btnElSub: 'For Greek-speaking classes',
      btnEn: 'English blocks', btnEnSub: 'For English-speaking classes',
      open: 'Open editor',
      stepsTitle: 'Getting started',
      s1: 'Press one of the two buttons. The editor opens with the WeDo 2.0 blocks already in the palette.',
      s2: 'If the editor asks whether to allow the extension to run without a sandbox, allow it. Without this it cannot use Bluetooth.',
      s3: 'Press the green “Connect to WeDo 2.0” button in the palette, then press the hub button so its light blinks.',
      s4: 'Choose the hub from the list. Once connected, its light turns blue.',
      reqTitle: 'What you need',
      req: 'Chrome or Edge on Windows, macOS, ChromeOS or an Android tablet. It does not work on iPad or in Firefox. Internet is only needed to open the page; the hub talks to the computer locally over Bluetooth.',
      shareTitle: 'For teachers',
      shareText: 'Show the QR code in class or share the link. A project made with the Greek blocks opens normally with the English ones too.',
      copy: 'Copy', copied: 'Copied',
      footer: 'STEM Education · Extension for the TurboWarp editor (Scratch 3 compatible).'
    }
  };

  // Τα links φτιάχνονται αυτόματα από τη διεύθυνση της σελίδας
  const base = new URL('./', location.href).href;
  const editorLink = (file) => 'https://turbowarp.org/editor?extension=' + encodeURIComponent(base + file);
  const links = { el: editorLink('wedo2-gr.js'), en: editorLink('wedo2-en.js') };

  document.getElementById('open-el').href = links.el;
  document.getElementById('open-en').href = links.en;
  document.getElementById('url-el').value = links.el;
  document.getElementById('url-en').value = links.en;

  if (window.QRCode) {
    for (const k of ['el', 'en']) {
      new QRCode(document.getElementById('qr-' + k), { text: links[k], width: 160, height: 160, correctLevel: QRCode.CorrectLevel.L });
    }
  }

  let lang = 'el';
  function setLang (l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = TEXT[l][el.dataset.t]; });
    document.querySelectorAll('[data-set-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.setLang === l)));
    document.title = TEXT[l].title + ' – STEM Education';
  }
  document.querySelectorAll('[data-set-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.setLang)));
  setLang((navigator.language || 'el').toLowerCase().startsWith('el') ? 'el' : 'en');

  document.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const input = document.getElementById(btn.dataset.copy);
      try { await navigator.clipboard.writeText(input.value); }
      catch (e) { input.select(); document.execCommand('copy'); }
      btn.textContent = TEXT[lang].copied;
      setTimeout(() => { btn.textContent = TEXT[lang].copy; }, 1500);
    });
  });
</script>
</body>
</html>
